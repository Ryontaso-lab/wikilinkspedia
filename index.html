<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>Wiki Constellation Explorer</title>



  <!-- PWA マニフェスト & メタ設定 -->

  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#0284c7">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="apple-touch-icon" href="icon-192.png">



  <!-- Wikipedia 公式モバイル用スタイルシート -->

  <link rel="stylesheet" href="https://en.wikipedia.org/w/load.php?modules=skins.minerva.content.styles|ext.cite.style&only=styles" />

  

  <!-- Leaflet.js (OpenStreetMap) -->

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



  <style>

    :root {

      --bg: #f8fafc;

      --card: #ffffff;

      --text: #0f172a;

      --sub: #64748b;

      --border: #cbd5e1;

      --primary: #0284c7;

      --accent: #6366f1;

      --table-th: #f1f5f9;

      --table-border: #cbd5e1;

      --status-bar-height: 0px;

    }



    body.dark {

      --bg: #0b0f19;

      --card: #1e293b;

      --text: #f8fafc;

      --sub: #94a3b8;

      --border: #334155;

      --primary: #38bdf8;

      --accent: #818cf8;

      --table-th: #1e293b;

      --table-border: #475569;

    }



    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }



    body {

      margin: 0;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      background: var(--bg);

      color: var(--text);

      display: flex;

      flex-direction: column;

      height: 100vh;

      overflow: hidden;

    }



    /* ヘッダー */

    header {

      background: var(--card);

      border-bottom: 1px solid var(--border);

      padding-top: max(8px, env(safe-area-inset-top, 0px), var(--status-bar-height));

      padding-bottom: 8px;

      padding-left: 16px;

      padding-right: 16px;

      display: flex;

      gap: 8px;

      align-items: center;

      z-index: 100;

      flex-shrink: 0;

    }



    input {

      flex: 1;

      min-width: 0;

      padding: 10px 14px;

      border: 1px solid var(--border);

      border-radius: 8px;

      background: var(--bg);

      color: var(--text);

      font-size: 15px;

      outline: none;

    }



    button {

      padding: 10px 16px;

      border: none;

      border-radius: 8px;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

      white-space: nowrap;

      transition: opacity 0.15s;

    }

    button:active { opacity: 0.8; }



    .btn-main { background: var(--primary); color: #fff; }

    .btn-star { background: var(--accent); color: #fff; }

    .btn-sub { background: var(--border); color: var(--text); }

    .btn-install { background: #10b981; color: #fff; display: none; }



    /* メインコンテナ（大画面・タブレット向け2カラム） */

    .container {

      display: flex;

      flex-direction: row;

      flex: 1;

      overflow: hidden;

      position: relative;

    }



    /* 左サイドバー */

    aside {

      width: 280px;

      border-right: 1px solid var(--border);

      background: var(--card);

      overflow-y: auto;

      padding: 12px;

      display: flex;

      flex-direction: column;

      gap: 6px;

      flex-shrink: 0;

    }



    .hist-title {

      font-size: 12px;

      font-weight: bold;

      color: var(--sub);

      text-transform: uppercase;

      letter-spacing: 0.5px;

      padding-left: 4px;

      margin-bottom: 4px;

    }



    .hist-item {

      padding: 10px 12px;

      border-radius: 8px;

      font-size: 14px;

      color: var(--primary);

      cursor: pointer;

      border: 1px solid transparent;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      transition: background 0.15s;

    }

    .hist-item:hover {

      background: rgba(2, 132, 199, 0.05);

    }

    .hist-item.active {

      background: rgba(2, 132, 199, 0.12);

      border-color: var(--primary);

      font-weight: bold;

    }



    /* 右メインエリア */

    main {

      flex: 1;

      overflow-y: auto;

      padding: 24px;

      padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));

      -webkit-overflow-scrolling: touch;

    }



    .article-wrap {

      max-width: 960px;

      margin: 0 auto;

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: 12px;

      padding: 32px;

      line-height: 1.85;

      font-size: 16px;

      min-height: 400px;

      word-wrap: break-word;

    }



    h1#art-title {

      margin-top: 0;

      font-size: 28px;

      border-bottom: 2px solid var(--border);

      padding-bottom: 12px;

    }



    /* 記事本文スタイル（下線なし・余白なしリンク） */

    #art-body a {

      color: var(--primary) !important;

      text-decoration: none !important;

      cursor: pointer;

      padding: 0 !important;

      margin: 0 !important;

      display: inline;

    }

    #art-body a:active {

      background-color: rgba(2, 132, 199, 0.15);

    }



    /* 本文画像保護（Leaflet関連の画像を除外） */

    #art-body img:not(.leaflet-tile):not(.leaflet-marker-icon):not(.leaflet-marker-shadow):not([class*="leaflet"]):not([class*="locmap"]) {

      max-width: 100%;

      height: auto;

      border-radius: 6px;

    }



    /* 位置図（Location Map）保護 */

    #art-body .locmap,

    #art-body [class*="locmap"],

    #art-body .location-map {

      position: relative !important;

      display: block !important;

      margin: 12px auto !important;

      overflow: visible !important;

      max-width: 100% !important;

    }



    #art-body .locmap div,

    #art-body [class*="locmap"] div {

      position: absolute !important;

      margin: 0 !important;

      padding: 0 !important;

    }



    #art-body .locmap img,

    #art-body [class*="locmap"] img {

      max-width: none !important;

      margin: 0 !important;

      display: block !important;

    }



    /* 表とInfoboxのスクロール保護 */

    .table-scroll-wrapper {

      width: 100%;

      overflow-x: auto;

      margin: 16px 0;

      border: 1px solid var(--table-border);

      border-radius: 8px;

      -webkit-overflow-scrolling: touch;

    }



    #art-body table {

      width: 100% !important;

      border-collapse: collapse !important;

      font-size: 14px;

      background: var(--card);

      color: var(--text);

    }



    #art-body th, #art-body td {

      border: 1px solid var(--table-border) !important;

      padding: 8px 12px !important;

    }



    #art-body th { background-color: var(--table-th) !important; }



    /* OpenStreetMap 専用保護スタイル */

    .osm-container {

      width: 100% !important;

      min-width: 260px !important;

      height: 380px !important;

      margin: 18px 0 !important;

      border-radius: 10px !important;

      border: 1px solid var(--border) !important;

      overflow: hidden !important;

      position: relative !important;

      z-index: 10 !important;

      background: #e2e8f0;

      display: block !important;

    }



    .osm-container .leaflet-tile-container img.leaflet-tile {

      max-width: none !important;

      max-height: none !important;

      width: 256px !important;

      height: 256px !important;

      border-radius: 0 !important;

      margin: 0 !important;

      padding: 0 !important;

      border: none !important;

      box-shadow: none !important;

      position: absolute !important;

      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

    }



    .osm-container .leaflet-marker-icon,

    .osm-container .leaflet-marker-shadow {

      max-width: none !important;

      max-height: none !important;

      margin: 0 !important;

      padding: 0 !important;

      border: none !important;

      position: absolute !important;

      display: block !important;

    }



    .osm-container .leaflet-pane {

      position: absolute !important;

      z-index: 400 !important;

    }



    .mw-ref, .reference, .navbox, .vertical-navbox, .noprint, .mw-empty-elt { display: none !important; }



    /* 星座モーダル */

    #star-overlay {

      position: absolute;

      inset: 0;

      background: rgba(11, 15, 25, 0.98);

      z-index: 999;

      display: none;

      flex-direction: column;

    }

    #star-overlay.open { display: flex; }



    .star-header {

      padding-top: max(12px, env(safe-area-inset-top, 0px), var(--status-bar-height));

      padding-bottom: 12px;

      padding-left: 20px;

      padding-right: 20px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      border-bottom: 1px solid #334155;

      color: #fff;

      flex-shrink: 0;

    }



    .canvas-box { flex: 1; width: 100%; height: 100%; position: relative; }

    #star-canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }



    /* スマホ向けレスポンシブスタイル */

    @media (max-width: 767px) {

      .container { flex-direction: column; }

      aside {

        width: 100%;

        height: 48px;

        flex-direction: row;

        border-right: none;

        border-bottom: 1px solid var(--border);

        overflow-x: auto;

        overflow-y: hidden;

        padding: 6px 8px;

        align-items: center;

      }

      .hist-title { display: none; }

      .hist-item { flex-shrink: 0; padding: 6px 10px; font-size: 13px; }

      main { padding: 14px; }

      .article-wrap { padding: 16px; font-size: 15px; }

      h1#art-title { font-size: 20px; }

      .osm-container { height: 260px !important; }

    }

  </style>

</head>

<body>



  <header id="app-header">

    <input type="text" id="q-input" placeholder="キーワード (例: 日本, 富士山, 太陽系)">

    <button class="btn-main" onclick="onSearch()">開く</button>

    <button class="btn-star" onclick="openStars()">🌌 星座</button>

    <button class="btn-sub" onclick="fetchRandom()" title="ランダムな記事">🎲</button>

    <button class="btn-sub" onclick="toggleTheme()" id="th-btn">🌙</button>

    <button id="pwa-install-btn" class="btn-install">📥 インストール</button>

  </header>



  <div class="container">

    <aside id="aside-bar">

      <div class="hist-title">探索ログ</div>

      <div id="hist-list" style="display:contents;"></div>

    </aside>

    <main id="main-scroll">

      <div class="article-wrap">

        <h1 id="art-title">読み込み中...</h1>

        <div id="art-body" class="mw-parser-output"><p style="color:var(--sub)">ランダムな扉を開いています...</p></div>

      </div>

    </main>



    <div id="star-overlay">

      <div class="star-header">

        <div>

          <strong id="star-title" style="font-size: 16px;">星座マップ</strong>

          <span style="font-size: 13px; color: #94a3b8; margin-left: 10px;">(星をタップして移動)</span>

        </div>

        <button class="btn-sub" onclick="closeStars()">✕ 閉じる</button>

      </div>

      <div class="canvas-box" id="canvas-box">

        <canvas id="star-canvas"></canvas>

      </div>

    </div>

  </div>



  <script>

    // PWA Service Worker 登録

    if ('serviceWorker' in navigator) {

      window.addEventListener('load', () => {

        navigator.serviceWorker.register('./sw.js')

          .then(() => console.log('ServiceWorker 登録成功'))

          .catch(err => console.log('ServiceWorker 登録失敗:', err));

      });

    }



    // PWA インストールボタン制御

    let deferredPrompt;

    const installBtn = document.getElementById('pwa-install-btn');



    window.addEventListener('beforeinstallprompt', (e) => {

      e.preventDefault();

      deferredPrompt = e;

      installBtn.style.display = 'inline-block';

    });



    installBtn.addEventListener('click', async () => {

      if (!deferredPrompt) return;

      deferredPrompt.prompt();

      const { outcome } = await deferredPrompt.userChoice;

      if (outcome === 'accepted') {

        installBtn.style.display = 'none';

      }

      deferredPrompt = null;

    });



    window.addEventListener('appinstalled', () => {

      installBtn.style.display = 'none';

      deferredPrompt = null;

    });



    // Android ステータスバー重なり防止

    function applyAndroidNotchFix() {

      const isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid) {

        const calculatedBarHeight = Math.max(28, Math.round(window.screen.height - window.innerHeight));

        const safeMargin = (calculatedBarHeight > 0 && calculatedBarHeight < 80) ? calculatedBarHeight : 32;

        document.documentElement.style.setProperty('--status-bar-height', `${safeMargin}px`);

      }

    }

    applyAndroidNotchFix();



    // 履歴管理：{ title: '記事名', scrollY: 0 }

    const historyData = [];

    let currentIdx = -1;

    let starLinks = [];

    let currentTitle = '';

    let lastHandledClipboard = '';



    // クリップボード自動検知

    async function checkClipboardForWiki() {

      try {

        if (!navigator.clipboard || !navigator.clipboard.readText) return;

        const text = await navigator.clipboard.readText();

        if (!text || text === lastHandledClipboard) return;



        if (text.includes('wikipedia.org/wiki/')) {

          const parts = text.split('/wiki/');

          if (parts[1]) {

            const rawTitle = parts[1].split('#')[0].split('?')[0];

            const targetTitle = decodeURIComponent(rawTitle).replace(/_/g, ' ');

            

            if (targetTitle && targetTitle !== currentTitle) {

              lastHandledClipboard = text;

              if (confirm(`コピーされた記事「${targetTitle}」を開きますか？`)) {

                loadArticle(targetTitle);

              }

            }

          }

        }

      } catch (e) {}

    }



    window.addEventListener('focus', checkClipboardForWiki);

    document.addEventListener('visibilitychange', () => {

      if (document.visibilityState === 'visible') checkClipboardForWiki();

    });



    // テーマ切り替え

    function toggleTheme() {

      const isDark = document.body.classList.toggle('dark');

      localStorage.setItem('wiki_theme', isDark ? 'dark' : 'light');

      document.getElementById('th-btn').innerText = isDark ? '☀️' : '🌙';

    }

    if (localStorage.getItem('wiki_theme') === 'dark') toggleTheme();



    // Wikipedia HTML 取得

    async function fetchWikiHTML(title) {

      const rawTitle = title.replace(/ /g, '_');

      const directUrl = `https://ja.wikipedia.org/api/rest_v1/page/html/${encodeURIComponent(rawTitle)}`;

      try {

        const res = await fetch(directUrl);

        if (res.ok) return await res.text();

      } catch (e) {}



      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(directUrl)}`;

      const resProxy = await fetch(proxyUrl);

      if (!resProxy.ok) throw new Error('通信エラー');

      const json = await resProxy.json();

      return json.contents;

    }



    // 記事読み込み処理（スクロール位置復元対応）

    async function loadArticle(title, addHist = true, restoreScrollY = 0) {

      if (!title) return;



      const mainScroll = document.getElementById('main-scroll');



      // 移動前にスクロール位置を保存

      if (currentIdx >= 0 && historyData[currentIdx]) {

        historyData[currentIdx].scrollY = mainScroll.scrollTop;

      }



      const tElem = document.getElementById('art-title');

      const bElem = document.getElementById('art-body');



      tElem.innerText = title;

      bElem.innerHTML = '<p style="color:var(--sub)">記事を取得しています...</p>';



      try {

        const html = await fetchWikiHTML(title);

        currentTitle = title;

        tElem.innerText = currentTitle;

        bElem.innerHTML = html;



        if (addHist) {

          historyData.push({ title: currentTitle, scrollY: 0 });

          currentIdx = historyData.length - 1;

          renderHistory();

        }



        fixMediaAndOfficialStyles();

        renderLeafletMaps();

        extractStarLinks();



        requestAnimationFrame(() => {

          setTimeout(() => {

            mainScroll.scrollTo({ top: restoreScrollY, behavior: restoreScrollY > 0 ? 'smooth' : 'auto' });

          }, 60);

        });



      } catch (err) {

        bElem.innerHTML = `

          <div style="padding: 20px; text-align: center;">

            <p style="color: #ef4444; font-weight: bold;">記事の取得に失敗しました</p>

            <button class="btn-main" onclick="loadArticle('${title}')" style="margin-top: 10px;">もう一度試す</button>

            <button class="btn-sub" onclick="fetchRandom()" style="margin-top: 10px; margin-left: 6px;">別のランダム記事</button>

          </div>

        `;

      }

    }



    // リンク判定（内部リンクはアプリ内遷移、外部リンクは既定ブラウザ起動）

    document.getElementById('art-body').addEventListener('click', (e) => {

      const anchor = e.target.closest('a');

      if (!anchor) return;



      const href = anchor.getAttribute('href') || '';

      if (!href || href.startsWith('#')) return;



      let internalTitle = '';

      if (href.startsWith('./')) {

        internalTitle = href.replace('./', '');

      } else if (href.startsWith('/wiki/')) {

        internalTitle = href.replace('/wiki/', '');

      } else if (href.includes('wikipedia.org/wiki/')) {

        internalTitle = href.split('/wiki/')[1];

      }



      if (internalTitle) {

        internalTitle = internalTitle.split('#')[0].split('?')[0];

        if (!internalTitle.includes(':')) {

          e.preventDefault();

          e.stopPropagation();

          const cleanTitle = decodeURIComponent(internalTitle).replace(/_/g, ' ');

          if (cleanTitle && cleanTitle !== currentTitle) {

            loadArticle(cleanTitle);

          }

          return;

        }

      }



      if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('//')) {

        e.preventDefault();

        e.stopPropagation();

        let fullUrl = href;

        if (fullUrl.startsWith('//')) fullUrl = 'https:' + fullUrl;

        try {

          window.open(fullUrl, '_system');

        } catch (err) {

          window.open(fullUrl, '_blank');

        }

      }

    });



    // ランダム記事取得

    async function fetchRandom() {

      const tElem = document.getElementById('art-title');

      const bElem = document.getElementById('art-body');

      tElem.innerText = '🎲 探しています...';

      bElem.innerHTML = '<p style="color:var(--sub)">ランダムな扉を開いています...</p>';



      const randomApiUrl = 'https://ja.wikipedia.org/api/rest_v1/page/random/title';

      try {

        let randomTitle = '';

        try {

          const res = await fetch(randomApiUrl);

          if (res.ok) {

            const data = await res.json();

            if (data.items && data.items[0]) randomTitle = data.items[0].title;

          }

        } catch (e) {}



        if (!randomTitle) {

          const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(randomApiUrl)}`;

          const resProxy = await fetch(proxyUrl);

          if (resProxy.ok) {

            const json = await resProxy.json();

            const data = JSON.parse(json.contents);

            if (data.items && data.items[0]) randomTitle = data.items[0].title;

          }

        }



        if (randomTitle) {

          loadArticle(randomTitle.replace(/_/g, ' '));

        } else {

          throw new Error('取得失敗');

        }

      } catch (err) {

        const fallbackSeeds = ['日本', '富士山', '宇宙', '東京タワー', '地球'];

        loadArticle(fallbackSeeds[Math.floor(Math.random() * fallbackSeeds.length)]);

      }

    }



    // OpenStreetMap (Leaflet) 描画 & 多段階同期

    function renderLeafletMaps() {

      const body = document.getElementById('art-body');

      const mapElements = body.querySelectorAll('.mw-kartographer-map, .mapframe, [data-mw-kartographer]');



      mapElements.forEach((el, index) => {

        let lat = el.getAttribute('data-lat');

        let lon = el.getAttribute('data-lon');

        let zoom = parseInt(el.getAttribute('data-zoom') || '13', 10);



        if (!lat || !lon) {

          try {

            const mwData = JSON.parse(el.getAttribute('data-mw-kartographer') || '{}');

            if (mwData.latitude) lat = mwData.latitude;

            if (mwData.longitude) lon = mwData.longitude;

            if (mwData.zoom) zoom = parseInt(mwData.zoom, 10);

          } catch (e) {}

        }



        if (lat && lon && typeof L !== 'undefined') {

          const mapId = `osm-map-${Date.now()}-${index}`;

          const mapDiv = document.createElement('div');

          mapDiv.id = mapId;

          mapDiv.className = 'osm-container';



          if (el.parentElement) {

            el.parentElement.style.maxWidth = '100%';

          }



          el.parentNode.replaceChild(mapDiv, el);



          setTimeout(() => {

            try {

              const map = L.map(mapId, {

                scrollWheelZoom: false,

                attributionControl: false

              }).setView([parseFloat(lat), parseFloat(lon)], zoom);



              L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {

                maxZoom: 19

              }).addTo(map);



              L.marker([parseFloat(lat), parseFloat(lon)]).addTo(map);



              map.invalidateSize();

              setTimeout(() => { map.invalidateSize(); }, 200);

              setTimeout(() => { map.invalidateSize(); }, 500);

            } catch (err) {}

          }, 50);

        }

      });

    }



    // メディア・表スタイル補正

    function fixMediaAndOfficialStyles() {

      const body = document.getElementById('art-body');



      body.querySelectorAll('img').forEach(img => {

        let src = img.getAttribute('src');

        if (src) {

          if (src.startsWith('//')) img.setAttribute('src', 'https:' + src);

          else if (src.startsWith('/')) img.setAttribute('src', 'https://ja.wikipedia.org' + src);

          else if (src.startsWith('./')) img.setAttribute('src', src.replace('./', 'https://ja.wikipedia.org/wiki/'));

        }

        let srcset = img.getAttribute('srcset');

        if (srcset) img.setAttribute('srcset', srcset.replace(/\/\//g, 'https://'));

      });



      body.querySelectorAll('table').forEach(tbl => {

        if (!tbl.closest('.locmap') && !tbl.querySelector('.osm-container') && !tbl.parentElement.classList.contains('table-scroll-wrapper')) {

          const wrap = document.createElement('div');

          wrap.className = 'table-scroll-wrapper';

          tbl.parentNode.insertBefore(wrap, tbl);

          wrap.appendChild(tbl);

        }

      });

    }



    // 星座リンク抽出

    function extractStarLinks() {

      const links = document.querySelectorAll('#art-body a');

      const set = new Set();

      links.forEach(a => {

        let href = a.getAttribute('href') || '';

        let target = '';

        if (href.startsWith('./')) target = href.replace('./', '');

        else if (href.startsWith('/wiki/')) target = href.replace('/wiki/', '');

        

        if (target) {

          target = target.split('#')[0].split('?')[0];

          if (!target.includes(':')) {

            set.add(decodeURIComponent(target).replace(/_/g, ' '));

          }

        }

      });

      starLinks = Array.from(set).slice(0, 20);

    }



    // 静止型星座マップ

    const canvas = document.getElementById('star-canvas');

    const ctx = canvas.getContext('2d');

    let stars = [];



    function openStars() {

      document.getElementById('star-title').innerText = `「${currentTitle}」`;

      const overlay = document.getElementById('star-overlay');

      overlay.classList.add('open');



      requestAnimationFrame(() => {

        requestAnimationFrame(() => {

          resizeAndRender();

        });

      });

    }



    function closeStars() {

      document.getElementById('star-overlay').classList.remove('open');

    }



    function resizeAndRender() {

      const box = document.getElementById('canvas-box');

      const rect = box.getBoundingClientRect();

      canvas.width = rect.width || window.innerWidth;

      canvas.height = rect.height || (window.innerHeight - 60);

      initConstellation();

    }



    function initConstellation() {

      stars = [];

      const w = canvas.width;

      const h = canvas.height;

      const cx = w / 2;

      const cy = h / 2;



      const isTablet = w >= 768;

      const centerR = isTablet ? 20 : 16;

      const starR = isTablet ? 8 : 6;



      stars.push({

        title: currentTitle,

        x: cx,

        y: cy,

        r: centerR,

        color: '#38bdf8',

        isCenter: true

      });



      const count = starLinks.length;

      if (count === 0) {

        drawStarsOnce();

        return;

      }



      const minDim = Math.min(w, h);

      const baseDist = minDim * (isTablet ? 0.38 : 0.36);



      starLinks.forEach((t, i) => {

        const rad = (i / count) * Math.PI * 2;

        const offset = (i % 2 === 0 ? 1 : -1) * (minDim * 0.05);

        const dist = baseDist + offset;



        stars.push({

          title: t,

          x: cx + Math.cos(rad) * dist,

          y: cy + Math.sin(rad) * dist,

          r: starR,

          color: '#e0f2fe',

          isCenter: false

        });

      });



      drawStarsOnce();

    }



    function drawStarsOnce() {

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const center = stars[0];

      if (!center) return;



      const isTablet = canvas.width >= 768;



      for (let i = 1; i < stars.length; i++) {

        const s = stars[i];

        ctx.beginPath();

        ctx.moveTo(center.x, center.y);

        ctx.lineTo(s.x, s.y);

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';

        ctx.lineWidth = 1;

        ctx.stroke();



        const next = stars[i === stars.length - 1 ? 1 : i + 1];

        if (next) {

          ctx.beginPath();

          ctx.moveTo(s.x, s.y);

          ctx.lineTo(next.x, next.y);

          ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)';

          ctx.lineWidth = 0.8;

          ctx.stroke();

        }

      }



      stars.forEach(s => {

        ctx.beginPath();

        ctx.arc(s.x, s.y, s.r + (s.isCenter ? 6 : 2), 0, Math.PI * 2);

        ctx.fillStyle = s.isCenter ? 'rgba(56, 189, 248, 0.25)' : 'rgba(255, 255, 255, 0.08)';

        ctx.fill();



        ctx.beginPath();

        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);

        ctx.fillStyle = s.color;

        ctx.fill();



        ctx.font = s.isCenter ? (isTablet ? 'bold 15px sans-serif' : 'bold 13px sans-serif') : (isTablet ? '13px sans-serif' : '11px sans-serif');

        ctx.fillStyle = s.isCenter ? '#38bdf8' : '#cbd5e1';

        ctx.textAlign = 'center';

        

        const displayLabel = s.title.length > 10 ? s.title.slice(0, 9) + '…' : s.title;

        ctx.fillText(displayLabel, s.x, s.y + s.r + (isTablet ? 16 : 13));

      });

    }



    canvas.addEventListener('pointerdown', (e) => {

      const rect = canvas.getBoundingClientRect();

      const px = e.clientX - rect.left;

      const py = e.clientY - rect.top;



      const hit = stars.find(s => Math.hypot(s.x - px, s.y - py) < s.r + 20);

      if (hit && !hit.isCenter) {

        closeStars();

        loadArticle(hit.title);

      }

    });



    window.addEventListener('resize', () => {

      if (document.getElementById('star-overlay').classList.contains('open')) {

        resizeAndRender();

      }

    });



    // 探索ログ描画

    function renderHistory() {

      const list = document.getElementById('hist-list');

      list.innerHTML = '';

      historyData.forEach((item, i) => {

        const elem = document.createElement('div');

        elem.className = `hist-item ${i === currentIdx ? 'active' : ''}`;

        elem.innerText = `${i + 1}. ${item.title}`;

        elem.onclick = () => {

          if (currentIdx === i) return;

          const targetScrollY = item.scrollY || 0;

          currentIdx = i;

          loadArticle(item.title, false, targetScrollY);

          renderHistory();

        };

        list.appendChild(elem);

      });

    }



    function onSearch() {

      const v = document.getElementById('q-input').value.trim();

      if (v) loadArticle(v);

    }

    document.getElementById('q-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') onSearch(); });



    // ★ 共有ターゲット & URLクエリからの自動オープン処理 ★

    function handleIncomingShare() {

      const params = new URLSearchParams(window.location.search);

      const incomingUrl = params.get('url') || params.get('text') || '';

      const incomingTitle = params.get('title') || '';



      let targetTitle = '';



      // URLから記事名を抽出 (例: https://ja.wikipedia.org/wiki/富士山)

      if (incomingUrl.includes('wikipedia.org/wiki/')) {

        const raw = incomingUrl.split('/wiki/')[1];

        if (raw) {

          targetTitle = decodeURIComponent(raw.split('#')[0].split('?')[0]).replace(/_/g, ' ');

        }

      } else if (incomingTitle && !incomingTitle.includes('http')) {

        // タイトルが「富士山 - Wikipedia」等の形式で渡された場合の成型

        targetTitle = incomingTitle.replace(/ - Wikipedia.*$/, '').trim();

      }



      if (targetTitle) {

        loadArticle(targetTitle);

      } else {

        // 共有経由でない通常起動時はランダム記事を表示

        fetchRandom();

      }

    }



    // アプリ起動実行

    handleIncomingShare();

  </script>
